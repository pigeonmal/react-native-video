name: Build Media3 Exoplayer FFmpeg

on:
  workflow_dispatch:
    inputs:
      ANDROID_NDK:
        description: 'ANDROID_NDK'
        required: true
        default: 'r27b'
      ANDROID_ABI:
        description: 'ANDROID_ABI'
        required: true
        default: '21'
      ENABLED_DECODERS:
        description: 'ENABLED_DECODERS'
        required: true
        default: 'vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd'
      FFMPEG_RELEASE_BRANCH:
        description: 'FFMPEG_RELEASE_BRANCH'
        required: true
        default: '6.0'
      MEDIA_TAG:
        description: 'MEDIA_TAG'
        required: true
        default: '1.4.1'
      JITPACK_RELEASE:
        description: 'Create JitPack Release (true/false)'
        required: false
        default: 'true'

jobs:
  Build-Media3-Exoplayer-FFmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Set up Android NDK
        run: |
          cd "$GITHUB_WORKSPACE"
          wget https://dl.google.com/android/repository/android-ndk-${{ github.event.inputs.ANDROID_NDK }}-linux.zip
          unzip android-ndk-${{ github.event.inputs.ANDROID_NDK }}-linux.zip &>/dev/null
          rm -rf android-ndk-${{ github.event.inputs.ANDROID_NDK }}-linux.zip

      - name: Build Media3 Exoplayer FFmpeg
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch ${{ github.event.inputs.MEDIA_TAG }} https://github.com/androidx/media.git
          cd media
          FFMPEG_MODULE_PATH="$(pwd)/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$GITHUB_WORKSPACE"/android-ndk-${{ github.event.inputs.ANDROID_NDK }}
          HOST_PLATFORM="linux-x86_64"
          ANDROID_ABI=${{ github.event.inputs.ANDROID_ABI }}
          ENABLED_DECODERS=(${{ github.event.inputs.ENABLED_DECODERS }})
          cd libraries/decoder_ffmpeg && \
          git clone git://source.ffmpeg.org/ffmpeg && \
          cd ffmpeg && \
          git checkout release/${{ github.event.inputs.FFMPEG_RELEASE_BRANCH }} && \
          FFMPEG_PATH="$(pwd)"
          cd "${FFMPEG_MODULE_PATH}/jni" && \
          ln -s "$FFMPEG_PATH" ffmpeg
          cd "${FFMPEG_MODULE_PATH}/jni" && \
          ./build_ffmpeg.sh \
          "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "${HOST_PLATFORM}" "${ANDROID_ABI}" "${ENABLED_DECODERS[@]}"

      - name: Build FFmpeg AAR
        run: |
          cd "$GITHUB_WORKSPACE"
          cd media
          ./gradlew lib-decoder-ffmpeg:assembleRelease

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Create GitHub Release for JitPack
        if: github.event.inputs.JITPACK_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            media/libraries/decoder_ffmpeg/build/outputs/aar/lib-decoder-ffmpeg-release.aar
          tag_name: ffmpeg-${{ github.event.inputs.FFMPEG_RELEASE_BRANCH }}-media${{ github.event.inputs.MEDIA_TAG }}
          body: |
            # Media3 ExoPlayer FFmpeg Decoder
            
            - **FFmpeg Release**: ${{ github.event.inputs.FFMPEG_RELEASE_BRANCH }}
            - **Media Tag**: ${{ github.event.inputs.MEDIA_TAG }}
            - **Android NDK**: ${{ github.event.inputs.ANDROID_NDK }}
            - **Target ABI**: ${{ github.event.inputs.ANDROID_ABI }}
            - **Enabled Decoders**: ${{ github.event.inputs.ENABLED_DECODERS }}
            
            This AAR is ready for JitPack deployment.
            
            ## Usage with JitPack
            
            1. Add JitPack to your project's `settings.gradle`:
            ```gradle
            dependencyResolutionManagement {
                repositories {
                    maven { url 'https://jitpack.io' }
                }
            }
            ```
            
            2. Add the dependency to your module's `build.gradle`:
            ```gradle
            dependencies {
                implementation 'com.github.pigeonmal:react-native-video:ffmpeg-${{ github.event.inputs.FFMPEG_RELEASE_BRANCH }}-media${{ github.event.inputs.MEDIA_TAG }}'
            }
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media3-ffmpeg-decoder-${{ github.event.inputs.MEDIA_TAG }}
          path: media/libraries/decoder_ffmpeg/build/outputs/aar/

  Notify-JitPack:
    needs: Build-Media3-Exoplayer-FFmpeg
    runs-on: ubuntu-latest
    if: github.event.inputs.JITPACK_RELEASE == 'true'
    
    steps:
      - name: Notify JitPack Build
        run: |
          RELEASE_TAG="ffmpeg-${{ github.event.inputs.FFMPEG_RELEASE_BRANCH }}-media${{ github.event.inputs.MEDIA_TAG }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          
          echo "✅ Release created: $RELEASE_TAG"
          echo "📦 Repository: $REPO_URL"
          echo ""
          echo "🔗 JitPack URL:"
          echo "https://jitpack.io/#$(echo $REPO_URL | sed 's|.*github.com/||')/$(echo $RELEASE_TAG)"
          echo ""
          echo "⏳ JitPack will automatically build the AAR."
          echo "   Check https://jitpack.io for build status."