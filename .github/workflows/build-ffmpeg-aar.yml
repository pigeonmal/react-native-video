name: Build & Publish Media3 FFmpeg to Pages

on:
  workflow_dispatch:
    inputs:
      ANDROID_NDK:
        description: 'ANDROID_NDK'
        required: true
        default: 'r27b'
      ANDROID_ABI:
        description: 'ANDROID_ABI'
        required: true
        default: '21'
      ENABLED_DECODERS:
        description: 'ENABLED_DECODERS'
        required: true
        default: 'vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd'
      FFMPEG_RELEASE_BRANCH:
        description: 'FFMPEG_RELEASE_BRANCH'
        required: true
        default: '6.0'
      MEDIA_TAG:
        description: 'MEDIA_TAG (Version)'
        required: true
        default: '1.4.1'

jobs:
  Build-And-Deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nécessaire pour pousser sur la branche gh-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Set up Android NDK
        run: |
          cd "$GITHUB_WORKSPACE"
          wget https://dl.google.com/android/repository/android-ndk-${{ github.event.inputs.ANDROID_NDK }}-linux.zip
          unzip android-ndk-${{ github.event.inputs.ANDROID_NDK }}-linux.zip &>/dev/null
          rm -rf android-ndk-${{ github.event.inputs.ANDROID_NDK }}-linux.zip

      - name: Setup & Build FFmpeg
        run: |
          cd "$GITHUB_WORKSPACE"
          # Clone Media3
          git clone --depth 1 --branch ${{ github.event.inputs.MEDIA_TAG }} https://github.com/androidx/media.git
          
          # Setup Variables
          cd media
          FFMPEG_MODULE_PATH="$(pwd)/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$GITHUB_WORKSPACE"/android-ndk-${{ github.event.inputs.ANDROID_NDK }}
          HOST_PLATFORM="linux-x86_64"
          ANDROID_ABI=${{ github.event.inputs.ANDROID_ABI }}
          ENABLED_DECODERS=(${{ github.event.inputs.ENABLED_DECODERS }})
          
          # Build Native
          cd libraries/decoder_ffmpeg
          git clone git://source.ffmpeg.org/ffmpeg
          cd ffmpeg
          git checkout release/${{ github.event.inputs.FFMPEG_RELEASE_BRANCH }}
          FFMPEG_PATH="$(pwd)"
          
          cd "${FFMPEG_MODULE_PATH}/jni"
          ln -s "$FFMPEG_PATH" ffmpeg
          ./build_ffmpeg.sh \
            "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "${HOST_PLATFORM}" "${ANDROID_ABI}" "${ENABLED_DECODERS[@]}"

      # Étape 1 : Configurer Gradle pour publier dans un dossier LOCAL temporaire
      - name: Inject Local Publishing Config
        run: |
          cd "$GITHUB_WORKSPACE/media/libraries/decoder_ffmpeg"
          
          cat <<EOF >> build.gradle
          
          apply plugin: 'maven-publish'
          
          // [CORRECTION] Force la création du composant 'release'
          android {
              publishing {
                  singleVariant("release") {
                      withSourcesJar()
                  }
              }
          }
          
          afterEvaluate {
              publishing {
                  publications {
                      release(MavenPublication) {
                          // Maintenant 'components.release' existe grâce au bloc android ci-dessus
                          from components.release
                          
                          groupId = 'androidx.media3'
                          artifactId = 'media3-decoder-ffmpeg'
                          version = '${{ github.event.inputs.MEDIA_TAG }}'
                          
                          pom {
                              name = 'Media3 FFmpeg Decoder'
                              description = 'Unofficial FFmpeg decoder for Media3'
                              licenses {
                                  license {
                                      name = 'The Apache License, Version 2.0'
                                      url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                                  }
                              }
                          }
                      }
                  }
                  repositories {
                      maven {
                          name = "LocalRepo"
                          url = uri("file://" + System.getenv("GITHUB_WORKSPACE") + "/maven-export")
                      }
                  }
              }
          }
          EOF

      # Étape 2 : Générer les fichiers (AAR + POM) dans le dossier local
      - name: Generate Maven Artifacts
        run: |
          cd "$GITHUB_WORKSPACE/media"
          ./gradlew lib-decoder-ffmpeg:publish

      # Étape 3 : Pousser le contenu de "maven-export" vers la branche "gh-pages"
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./maven-export
          keep_files: true  # IMPORTANT : Garde les anciennes versions (v1.4.0) quand on publie la v1.4.1
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
